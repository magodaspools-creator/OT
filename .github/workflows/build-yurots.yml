name: Build Yurots 8.60

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.cpp"
      - "*.h"
      - "Makefile"
      - "config.lua"
      - "data/**"
      - "mods/**"
      - "tutoriais + db/**"
      - ".github/workflows/build-yurots.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liblua5.1-0-dev libboost-all-dev libgmp-dev libmariadb-dev libmariadb-dev-compat libxml2-dev libxml++2.6-dev libssl-dev zlib1g-dev libsqlite3-dev

      - name: Verify Lua timer crash guard is present
        run: |
          grep -F 'Temporary validation interfaces must not schedule callbacks.' luascript.cpp
          grep -F 'interface->m_interfaceName == "Test Interface"' luascript.cpp

      - name: Clean and compile existing Yurots source
        run: |
          make clean
          make -j2

      - name: Assemble runtime package
        run: |
          mkdir -p package
          cp theotxserver config.lua package/
          cp -a data package/
          sed -i -E 's/^[[:space:]]*sqlPass[[:space:]]*=.*/sqlPass = "CHANGE_ME_SET_YOUR_DB_PASSWORD"/' package/config.lua
          if [ -d mods ]; then cp -a mods package/; fi
          cp -a tutoriais\ +\ db/db_clean.sql package/database.sql
          cat > package/start.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          if grep -q 'CHANGE_ME_SET_YOUR_DB_PASSWORD' config.lua; then
            read -r -s -p "Senha do MySQL para o usuário configurado no config.lua: " DBPASS
            echo
            read -r -p "IP que os clientes usarão (IP público para amigos; Enter mantém o atual): " SERVERIP
            export DBPASS SERVERIP
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("config.lua")
          s = p.read_text()
          def lua_escape(v):
              return v.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n")
          s = re.sub(r'(?m)^(\s*sqlPass\s*=\s*")[^"]*(")', lambda m: m.group(1) + lua_escape(os.environ["DBPASS"]) + m.group(2), s, count=1)
          ip = os.environ.get("SERVERIP", "").strip()
          if ip:
              s = re.sub(r'(?m)^(\s*ip\s*=\s*")[^"]*(")', lambda m: m.group(1) + lua_escape(ip) + m.group(2), s, count=1)
          p.write_text(s)
          PY
          fi
          exec ./theotxserver
          EOF
          chmod +x package/start.sh
          cat > package/LEIA-ME.txt <<'EOF'
          CLASSICYUROTS - TIBIA 8.60

          Este pacote contém o binário compilado, datapack e mapa Yurots.
          O banco MySQL precisa ser criado/importado separadamente usando database.sql.
          Para criar contas pelo cliente 8.60, entre no Account Manager com conta 1 e senha 1.
          Use essa conta apenas para criar contas; não a compartilhe como conta de jogo.
          Antes de iniciar, edite config.lua e preencha sqlHost, sqlUser, sqlPass e sqlDatabase.
          Para jogar na mesma rede, use o IP LAN do computador servidor no cliente.
          Para amigos pela internet, configure encaminhamento TCP das portas configuradas em config.lua
          (loginPort e gamePort) no roteador e informe o IP público; CGNAT pode impedir conexões.
          Não exponha a porta 3306 do MySQL à internet.
          EOF

      - name: Upload server package
        uses: actions/upload-artifact@v4
        with:
          name: yurots-860-linux
          path: package/
          if-no-files-found: error
          retention-days: 14

  deploy-staging:
    name: Deliver package to Linux test machine
    needs: build
    runs-on: self-hosted
    steps:
      - name: Download package from this build
        uses: actions/download-artifact@v4
        with:
          name: yurots-860-linux
          path: downloaded-package

      - name: Install a versioned staging copy without overwriting existing files
        env:
          RELEASE_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          BASE="$HOME/yurots-860-staging"
          RELEASE="$BASE/releases/$RELEASE_ID"
          mkdir -p "$RELEASE"
          cp -a downloaded-package/. "$RELEASE/"
          chmod +x "$RELEASE/start.sh"
          ln -sfn "$RELEASE" "$BASE/current"
          echo "Package delivered to: $RELEASE"
          echo "Current staging link: $BASE/current"
          echo "This step does not start or restart the game server."
